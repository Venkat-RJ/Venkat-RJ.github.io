name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check contribution calendar SVG renderer
        run: node --test tests/contributions.test.mjs
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule'
        with:
          python-version: '3.11'
      - name: Install browser test runtime
        if: github.event_name != 'schedule'
        run: |
          python -m pip install 'playwright>=1.51,<2'
          python -m playwright install --with-deps chromium
      - name: Check RecursiveCal controls, exports, and responsive layouts
        if: github.event_name != 'schedule'
        run: python tests/recursivecal_browser_smoke.py site/recursivecal/index.html --artifacts artifacts/recursivecal-ui
      - name: Fetch official GitHub contribution activity
        run: node scripts/update-contributions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        id: pages_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`;
          let available = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(endpoint, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (!response.ok) throw new Error(`Artifact metadata request failed: HTTP ${response.status}`);
            const data = await response.json();
            const artifact = data.artifacts.find(item => item.name === process.env.PAGES_ARTIFACT_NAME && !item.expired);
            if (artifact) {
              console.log(`Pages artifact ${artifact.id} is available for deployment.`);
              appendFileSync(process.env.GITHUB_OUTPUT, `artifact_id=${artifact.id}\n`);
              available = true;
              break;
            }
            console.log(`Waiting for uploaded Pages artifact metadata (${attempt + 1}/12).`);
            if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!available) throw new Error('Uploaded Pages artifact did not appear in the Actions API within 55 seconds.');
          NODE
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            // Use the documented Pages API with the exact artifact verified above.
            // This retains the existing Pages and OIDC permissions and environment.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Missing verified Pages artifact ID.');
            const idToken = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages did not return a deployment ID.');
            core.info(`Created Pages deployment ${deploymentId} for ${context.sha}.`);
            if (deployment.page_url) core.setOutput('page_url', deployment.page_url);
            const failed = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            let completed = false;
            for (let poll = 0; poll < 60; poll++) {
              const {data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId
              });
              if (status.status === 'succeed') {
                core.info('Pages deployment succeeded.');
                core.setOutput('status', 'succeed');
                completed = true;
                break;
              }
              if (failed.has(status.status)) throw new Error(`Pages deployment ended with ${status.status}.`);
              core.info(`Pages deployment status: ${status.status}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!completed) {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
                ...context.repo, deploymentId
              });
              throw new Error('Pages deployment exceeded the five-minute timeout.');
            }
      - name: Upload RecursiveCal interface checks
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: RecursiveCal-interface-checks
          path: artifacts/recursivecal-ui/
          retention-days: 7
          if-no-files-found: warn
