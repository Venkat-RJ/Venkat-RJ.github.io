name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check contribution calendar SVG renderer
        run: node --test tests/contributions.test.mjs
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule'
        with:
          python-version: '3.11'
      - name: Install browser test runtime
        if: github.event_name != 'schedule'
        run: |
          python -m pip install 'playwright>=1.51,<2'
          python -m playwright install --with-deps chromium
      - name: Check RecursiveCal controls, exports, and responsive layouts
        if: github.event_name != 'schedule'
        run: python tests/recursivecal_browser_smoke.py site/recursivecal/index.html --artifacts artifacts/recursivecal-ui
      - name: Fetch official GitHub contribution activity
        run: node scripts/update-contributions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload RecursiveCal interface checks
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: RecursiveCal-interface-checks
          path: artifacts/recursivecal-ui/
          retention-days: 7
          if-no-files-found: warn
